name: Release

# Publishes a GitHub release whenever the version in package.json is bumped on
# master: the version job computes v<version>, skips if that release already
# exists, otherwise the build job packages dist/ and the release job publishes.
# `gh release create` creates the tag itself, pointing at the triggering commit.
on:
  push:
    branches: [master]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package
        run: |
          stage="kmweb-v${{ needs.version.outputs.version }}"
          mkdir -p dist-release
          tar -czf "dist-release/${stage}.tar.gz" -C dist .
          # the bundle is served straight out of the tarball (kmrs ADDs it as
          # its webui dir), so index.html must sit at the root
          tar -tzf "dist-release/${stage}.tar.gz" | grep -qx './index.html'
          sha256sum "dist-release/${stage}.tar.gz" > "dist-release/${stage}.sha256"
          cat "dist-release/${stage}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: kmweb
          path: dist-release/*

  release:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kmweb
          path: artifacts
      - run: gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA" artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
